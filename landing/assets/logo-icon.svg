    <path d="M38 70 q6.5 -5 13 0 t13 0 t13 0 t13 0" stroke-width="2.4" stroke-opacity=".75"/>
    <path d="M38 78 q6.5 -5 13 0 t13 0 t13 0 t13 0" stroke-width="2" stroke-opacity=".45"/>
