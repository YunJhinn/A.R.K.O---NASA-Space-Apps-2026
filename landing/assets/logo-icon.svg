    <rect x="5" y="-3.2" width="8" height="6.4" rx="1" fill="#7DF3FF"/>
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="#E8FBFF" stroke="#1A8CFF" stroke-width="1.2"/>
