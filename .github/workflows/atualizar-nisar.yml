# A.R.K.O · busca dados novos do NISAR todo dia e atualiza o app (data/)
name: Atualizar dados NISAR

on:
  schedule:
    - cron: "17 9 * * *"        # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch:             # botão "Run workflow" na aba Actions
    inputs:
      forcar:
        description: "Reprocessar mesmo sem passagem nova"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-nisar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar bibliotecas
        run: pip install -r pipeline/requirements.txt

      - name: Buscar passagem nova e processar
        id: nisar
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          FORCAR: ${{ inputs.forcar }}
        run: python pipeline/atualizar.py

      - name: Salvar os dados novos no repositório
        if: steps.nisar.outputs.novo == 'true'
        run: |
          git config user.name "yunjhinn"
          git config user.email "joaovtoralves@gmail.com"
          git add data/
          git commit -m "Dados NISAR atualizados: ${{ steps.nisar.outputs.periodo }}"
          git push

      - name: Atualizar o GitHub Pages
        if: steps.nisar.outputs.novo == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
